name: CD

# ปล่อยอัตโนมัติเมื่อ main ผ่าน CI → deploy client (Vercel) + API (Render)
# ตั้งค่า secrets ที่ Settings → Secrets and variables → Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-web:
    name: 🚀 Deploy web (Vercel)
    runs-on: ubuntu-latest
    needs:
      - verify
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install client deps
        run: npm --prefix client ci
      - name: Build
        run: npm --prefix client run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: client/dist
      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}" || echo "ปรับ VERCEL_ORG_ID / VERCEL_PROJECT_ID ถ้าจำเป็น"


  deploy-api:
    name: 🚀 Deploy API (Render)
    runs-on: ubuntu-latest
    needs:
      - verify
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  verify:
    name: ✅ Re-run smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix client ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm --prefix client run build
