name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ไม่ใส่ DATABASE_URL ใน CI → API จะใช้ demo mode (memory)
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────
  # 1) ตรวจคุณภาพโค้ด: typecheck ทั้ง api และ client
  # ─────────────────────────────────────────────
  typecheck:
    name: 🔍 Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (root)
        run: npm ci
      - name: Install (functions)
        run: npm --prefix functions install
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck (functions)
        run: npm --prefix functions run typecheck

  # ─────────────────────────────────────────────
  # 2) Unit tests (Vitest)
  # ─────────────────────────────────────────────
  unit-test:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix functions install
      - name: Unit tests (api + client)
        run: npm run test:unit

  # ─────────────────────────────────────────────
  # 3) Build ฝั่งเว็บ
  # ─────────────────────────────────────────────
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix functions install
      - name: Build client
        run: npm run build
      - name: Build functions
        run: npm --prefix functions run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4) E2E (Playwright) — เปิดทั้ง API และเว็บเอง
  # ─────────────────────────────────────────────
  e2e:
    name: 🎭 E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # ─────────────────────────────────────────────
  # 5) ตรวจว่า schema ใช้กับ Neon ได้จริง (ถ้ามี secret)
  # ─────────────────────────────────────────────
  neon-schema-check:
    name: 🟣 Neon schema check
    runs-on: ubuntu-latest
    if: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Apply schema to Neon (dry branch)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:push
      - name: Health check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ci-secret
        run: |
          npm run dev:server &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health; then
              echo ""
              curl -s http://localhost:8787/api/items/stats
              exit 0
            fi
            sleep 2
          done
          echo "API ไม่ตอบสนองใน 60 วินาที"
          exit 1
